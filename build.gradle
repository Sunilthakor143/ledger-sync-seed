plugins {
    id 'java'
    id 'application'
}

group = 'in.simplifymoney'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.mongodb:mongodb-driver-sync:5.0.1'
    runtimeOnly 'com.h2database:h2:2.2.224'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testcontainers:mongodb:1.19.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'in.simplifymoney.ledgersync.App'
}

test {
    useJUnitPlatform()
    exclude '**/mongo/**'
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
    }
}

tasks.register('mongoTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/mongo/**'
    environment "DOCKER_HOST", "npipe:////./pipe/docker_engine"
    environment "TESTCONTAINERS_CHECKS_DISABLE", "true"
    environment "TESTCONTAINERS_RYUK_DISABLED", "true"
    systemProperty "testcontainers.checks.disable", "true"
    systemProperty "testcontainers.ryuk.disabled", "true"
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
    }
}

// Dependency-free smoke run. Works with no network and no database.
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    mainClass = 'in.simplifymoney.ledgersync.SelfCheck'
    classpath = sourceSets.main.runtimeClasspath
}
